<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Rayan Ahmed — Creative Web Engineer</title>
  <meta name="description" content="Portfolio of Rayan Ahmed, a creative web engineer. A scroll-driven ride through a hand-built low-poly city — from sunrise cloud-dive to midnight tower." />
  <meta name="theme-color" content="#16131f" />

  <!-- Open Graph / social -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Rayan Ahmed — Creative Web Engineer" />
  <meta property="og:description" content="A cinematic scroll-driven portfolio. One endless ride through a hand-built city." />
  <meta property="og:image" content="assets/og-cover.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- 3D world -->
  <canvas id="gl" aria-hidden="true"></canvas>
  <div id="vignette" aria-hidden="true"></div>

  <!-- DOM journey overlays (populated by js/core/ui.js) -->
  <div id="overlay">
    <div id="chapters"></div>
    <section id="skills" aria-label="Skills"></section>
    <div id="works"></div>
    <section id="contact" aria-label="Contact"></section>
  </div>

  <!-- hero (populated by js/main.js) -->
  <section id="hero" aria-label="Intro"></section>

  <!-- header / hud / menu / footer (populated by js/core/ui.js) -->
  <header id="site-header"></header>
  <aside id="hud" aria-hidden="true"></aside>
  <nav id="menu" aria-label="Main menu"></nav>
  <footer id="footer"></footer>

  <!-- cookie toast -->
  <div id="cookie" role="dialog" aria-label="Cookie notice"></div>

  <!-- loader / start gate -->
  <div id="loader" role="dialog" aria-label="Loading">
    <div id="loader-top">
      <p id="loader-tag">A scroll-driven journey · strap in</p>
      <div id="loader-mark">
        <svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#16131f" stroke-width="2.4" stroke-linecap="round">
          <circle cx="17" cy="17" r="14.8" stroke-dasharray="4 5" />
          <path d="M10 22 17 9l7 13" />
        </svg>
        <span>Skyline<br/>Folio</span>
      </div>
    </div>
    <div id="loader-center">
      <div id="loader-counter-wrap">
        <span id="loader-counter">000</span>
      </div>
      <span id="loader-word">Waking the city</span>
      <button id="start-btn" data-cursor="Go">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9" stroke-dasharray="3 4"/>
          <path d="M10 8.5v7l6-3.5z" fill="currentColor" stroke="none"/>
        </svg>
        <span>Start the ride</span>
      </button>
    </div>
    <div id="loader-bottom">
      <div id="loader-bar"><span id="loader-bar-fill"></span></div>
      <div id="loader-notes"></div>
    </div>
  </div>

  <!-- libraries (local, no CDN) -->
  <script src="vendor/gsap.min.js"></script>
  <script type="module" src="js/main.js"></script>

  <noscript>
    <div style="position:fixed;inset:0;background:#faf3e7;color:#16131f;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;font-family:sans-serif;z-index:9999">
      <p><strong>Skyline Folio</strong> is an interactive ride — it needs JavaScript to move.<br/>Please enable JavaScript and come back for the journey.</p>
    </div>
  </noscript>
</body>
</html>

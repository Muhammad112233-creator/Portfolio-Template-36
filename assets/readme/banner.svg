<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- rainbow flowing gradient -->
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5c39">
        <animate attributeName="stop-color" values="#ff5c39;#ffd447;#00c2a8;#7c5cff;#ff4d8d;#ff5c39" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="25%" stop-color="#ffd447">
        <animate attributeName="stop-color" values="#ffd447;#00c2a8;#7c5cff;#ff4d8d;#ff5c39;#ffd447" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00c2a8">
        <animate attributeName="stop-color" values="#00c2a8;#7c5cff;#ff4d8d;#ff5c39;#ffd447;#00c2a8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" stop-color="#7c5cff">
        <animate attributeName="stop-color" values="#7c5cff;#ff4d8d;#ff5c39;#ffd447;#00c2a8;#7c5cff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ff4d8d">
        <animate attributeName="stop-color" values="#ff4d8d;#ff5c39;#ffd447;#00c2a8;#7c5cff;#ff4d8d" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- dusk sky -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141230"/>
      <stop offset="0.55" stop-color="#3a2a66"/>
      <stop offset="1" stop-color="#c8542f"/>
    </linearGradient>

    <linearGradient id="glowLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd447" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffd447"/>
      <stop offset="1" stop-color="#ffd447" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#sky)"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="90" cy="52" r="1.8"><animate attributeName="opacity" values="1;0.15;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="34" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="66" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="40" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="60" r="1.9"><animate attributeName="opacity" values="1;0.25;1" dur="3.4s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="38" r="1.5"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="80" r="1.7"><animate attributeName="opacity" values="1;0.2;1" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- low-poly skyline silhouette, sliding slowly -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-400 0" dur="18s" repeatCount="indefinite"/>
    <g fill="#0d0b22">
      <rect x="-400" y="220" width="70" height="100"/><rect x="-320" y="180" width="50" height="140"/><rect x="-250" y="240" width="90" height="80"/><rect x="-140" y="150" width="55" height="170"/><rect x="-70" y="205" width="80" height="115"/>
      <rect x="0" y="220" width="70" height="100"/><rect x="80" y="180" width="50" height="140"/><rect x="150" y="240" width="90" height="80"/><rect x="260" y="150" width="55" height="170"/><rect x="330" y="205" width="80" height="115"/>
      <rect x="400" y="220" width="70" height="100"/><rect x="480" y="180" width="50" height="140"/><rect x="550" y="240" width="90" height="80"/><rect x="660" y="150" width="55" height="170"/><rect x="730" y="205" width="80" height="115"/>
      <rect x="800" y="220" width="70" height="100"/><rect x="880" y="180" width="50" height="140"/><rect x="950" y="240" width="90" height="80"/><rect x="1060" y="150" width="55" height="170"/><rect x="1130" y="205" width="80" height="115"/>
      <rect x="1200" y="220" width="70" height="100"/><rect x="1280" y="180" width="50" height="140"/><rect x="1350" y="240" width="90" height="80"/><rect x="1460" y="150" width="55" height="170"/><rect x="1530" y="205" width="80" height="115"/>
    </g>
    <!-- lit windows -->
    <g fill="#ffd447" opacity="0.85">
      <rect x="96" y="196" width="7" height="9"/><rect x="112" y="212" width="7" height="9"/><rect x="276" y="170" width="7" height="9"/><rect x="292" y="200" width="7" height="9"/><rect x="496" y="196" width="7" height="9"/><rect x="676" y="170" width="7" height="9"/><rect x="896" y="196" width="7" height="9"/><rect x="1076" y="170" width="7" height="9"/><rect x="1296" y="196" width="7" height="9"/><rect x="1476" y="170" width="7" height="9"/>
      <rect x="166" y="256" width="7" height="9"/><rect x="566" y="256" width="7" height="9"/><rect x="966" y="256" width="7" height="9"/><rect x="1366" y="256" width="7" height="9"/>
    </g>
  </g>

  <!-- title with rainbow stroke-gradient -->
  <text x="600" y="132" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="76" font-weight="800" letter-spacing="4" fill="url(#rainbow)">SKYLINE・FOLIO</text>

  <!-- subtitle -->
  <text x="600" y="176" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="21" letter-spacing="7" fill="#faf3e7" opacity="0.9">A SCROLL-DRIVEN 3D CITY RIDE</text>

  <!-- animated glow line under subtitle -->
  <rect x="430" y="196" width="340" height="2.6" rx="1.3" fill="url(#glowLine)">
    <animate attributeName="x" values="430;460;430" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="width" values="340;280;340" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- tiny scooter zipping along the bottom road -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-120 296; 1320 296" dur="7s" repeatCount="indefinite"/>
    <circle cx="0" cy="0" r="7" fill="none" stroke="#faf3e7" stroke-width="2.6"/>
    <circle cx="42" cy="0" r="7" fill="none" stroke="#faf3e7" stroke-width="2.6"/>
    <path d="M0 0 L14 -14 L34 -14 L42 0 M34 -14 L38 -24 M30 -24 L46 -24" fill="none" stroke="#ff5c39" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="14" cy="-26" r="5.4" fill="#ffd447"/>
  </g>
</svg>

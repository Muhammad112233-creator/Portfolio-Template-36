<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 26" width="900" height="26">
  <defs>
    <linearGradient id="dv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5c39">
        <animate attributeName="stop-color" values="#ff5c39;#ffd447;#00c2a8;#7c5cff;#ff4d8d;#ff5c39" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#ffd447">
        <animate attributeName="stop-color" values="#ffd447;#00c2a8;#7c5cff;#ff4d8d;#ff5c39;#ffd447" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#7c5cff">
        <animate attributeName="stop-color" values="#7c5cff;#ff4d8d;#ff5c39;#ffd447;#00c2a8;#7c5cff" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <rect x="0" y="11" width="900" height="4" rx="2" fill="url(#dv)" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.55;0.9" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <circle cx="450" cy="13" r="6" fill="url(#dv)">
    <animate attributeName="cx" values="60;840;60" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>

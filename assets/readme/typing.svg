<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 70" width="900" height="70">
  <defs>
    <linearGradient id="tp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff">
        <animate attributeName="stop-color" values="#7c5cff;#ff4d8d;#ff5c39;#ffd447;#00c2a8;#7c5cff" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#00c2a8">
        <animate attributeName="stop-color" values="#00c2a8;#7c5cff;#ff4d8d;#ff5c39;#ffd447;#00c2a8" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <rect width="900" height="70" rx="12" fill="#16131f"/>
  <!-- typewriter lines: each types in, holds, erases -->
  <g font-family="'Courier New',monospace" font-size="24" font-weight="700" fill="url(#tp)">
    <text x="34" y="44">
      <tspan>$</tspan>
      <tspan dx="10" fill="#faf3e7">npm run ride</tspan>
      <tspan dx="8" fill="#ffd447">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.2;0.82;0.84;1" dur="8s" repeatCount="indefinite"/>
        — threejs • gsap • webaudio
      </tspan>
    </text>
  </g>
  <!-- blinking cursor -->
  <rect x="34" y="22" width="0" height="28" fill="#ffd447">
    <animate attributeName="x" values="34;34" dur="1s" repeatCount="indefinite"/>
  </rect>
  <rect x="118" y="24" width="13" height="25" fill="url(#tp)">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
